    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260530r991589_rule
    title: Ubuntu 22.04 LTS SSH daemon must prevent remote hosts from connecting to
      the proxy display.
    description: When X11 forwarding is enabled, there may be additional exposure
      to the server and client displays if the sshd proxy display is configured to
      listen on the wildcard address. By default, sshd binds the forwarding server
      to the loopback address and sets the hostname part of the DISPLAY environment
      variable to localhost. This prevents remote hosts from connecting to the proxy
      display.
    imported_data:
      fixtext: "Configure the SSH server to prevent remote hosts from connecting to
        the proxy display.  \n  \nAdd or modify the following line in the \"/etc/ssh/sshd_config\"
        file: \n \nX11UseLocalhost yes \n \nRestart the SSH daemon for the changes
        to take effect:  \n \n     $ sudo systemctl restart sshd.service"
    confine:
      os.release.major:
      - '22.04'
      os.name:
