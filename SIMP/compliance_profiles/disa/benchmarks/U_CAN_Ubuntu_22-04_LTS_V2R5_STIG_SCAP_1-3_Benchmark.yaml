    title: Ubuntu 22.04 LTS must generate audit records for all account creations,
      modifications, disabling, and termination events that affect /etc/passwd.
    description: "Once an attacker establishes access to a system, the attacker often
      attempts to create a persistent method of reestablishing access. One way to
      accomplish this is for the attacker to create an account. Auditing account creation
      actions provides logging that can be used for forensic purposes.  \n  \nTo address
      access requirements, many operating systems may be integrated with enterprise
      level authentication/access/auditing mechanisms that meet or exceed access control
      policy requirements.\n\nSatisfies: SRG-OS-000004-GPOS-00004, SRG-OS-000239-GPOS-00089,
      SRG-OS-000240-GPOS-00090, SRG-OS-000241-GPOS-00091, SRG-OS-000303-GPOS-00120,
      SRG-OS-000458-GPOS-00203, SRG-OS-000463-GPOS-00207, SRG-OS-000476-GPOS-00221"
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to generate audit records for all account
        creations, modifications, disabling, and termination events that affect \"/etc/passwd\".
        \n \nAdd or modify the following line to \"/etc/audit/rules.d/stig.rules\":
        \n \n-w /etc/passwd -p wa -k usergroup_modification \n \nTo reload the rules
        file, issue the following command: \n \n     $ sudo augenrules --load \n \nNote:
        The \"-k <keyname>\" at the end of the line gives the rule a unique meaning
        to help during an audit investigation. The <keyname> does not need to match
        the example above."
    confine:
