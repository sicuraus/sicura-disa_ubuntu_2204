    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260529r991589_rule
    title: Ubuntu 22.04 LTS must be configured so that remote X connections are disabled,
      unless to fulfill documented and validated mission requirements.
    description: "The security risk of using X11 forwarding is that the client's X11
      display server may be exposed to attack when the SSH client requests forwarding.
      \ A system administrator may have a stance in which they want to protect clients
      that may expose themselves to attack by unwittingly requesting X11 forwarding,
      which can warrant a ''no'' setting.  \n  \nX11 forwarding should be enabled
      with caution. Users with the ability to bypass file permissions on the remote
      host (for the user's X11 authorization database) can access the local X11 display
      through the forwarded connection. An attacker may then be able to perform activities
      such as keystroke monitoring if the ForwardX11Trusted option is also enabled.
      \ \n  \nIf X11 services are not required for the system's intended function,
      they should be disabled or restricted as appropriate to the system's needs."
    imported_data:
      fixtext: "Configure the SSH server to disable X11 forwarding.  \n \nAdd or modify
        the following line in the \"/etc/ssh/sshd_config\" file: \n \nX11Forwarding
        no  \n  \nRestart the SSH daemon for the changes to take effect:  \n  \n     $
        sudo systemctl restart sshd.service"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
