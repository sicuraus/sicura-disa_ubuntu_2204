    title: Ubuntu 22.04 LTS must be configured so that the Advance Package Tool (APT)
      removes all software components after updated versions have been installed.
    description: Previous versions of software components that are not removed from
      the information system after updates have been installed may be exploited by
      adversaries. Some information technology products may remove older versions
      of software automatically from the information system.
    imported_data:
