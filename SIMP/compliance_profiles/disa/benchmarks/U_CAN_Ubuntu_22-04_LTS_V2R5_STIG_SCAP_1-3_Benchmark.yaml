    title: Ubuntu 22.04 LTS must configure the directories used by the system journal
      to be owned by "root".
    description: "Only authorized personnel should be aware of errors and the details
      of the errors. Error messages are an indicator of an organization's operational
      state or can identify the operating system or platform. Additionally, personally
      identifiable information (PII) and operational information must not be revealed
      through error messages to unauthorized personnel or their designated representatives.
      \ \n  \nThe structure and content of error messages must be carefully considered
      by the organization and development team. The extent to which the information
      system is able to identify and handle error conditions is guided by organizational
      policy and operational requirements."
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to set the appropriate ownership to the
        directories used by the systemd journal: \n \nAdd or modify the following
        lines in the \"/usr/lib/tmpfiles.d/systemd.conf\" file: \n \nz /run/log/journal
        2640 root systemd-journal - - \nz /var/log/journal 2640 root systemd-journal
        - - \n \nRestart the system for the changes to take effect."
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
