    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260476r1015003_rule
    title: Ubuntu 22.04 LTS must be configured so that the Advance Package Tool (APT)
      prevents the installation of patches, service packs, device drivers, or operating
      system components without verification they have been digitally signed using
      a certificate that is recognized and approved by the organization.
    description: "Changes to any software components can have significant effects
      on the overall security of the operating system. This requirement ensures the
      software has not been tampered with and that it has been provided by a trusted
      vendor.\n  \nAccordingly, patches, service packs, device drivers, or operating
      system components must be signed with a certificate recognized and approved
      by the organization.\n  \nVerifying the authenticity of the software prior to
      installation validates the integrity of the patch or upgrade received from a
      vendor. This ensures the software has not been tampered with and that it has
      been provided by a trusted vendor. Self-signed certificates are disallowed by
      this requirement. The operating system should not have to verify the software
      again. This requirement does not mandate DOD certificates for this purpose;
      however, the certificate used to verify the software must be from an approved
      certificate authority (CA)."
    imported_data:
      fixtext: "Configure APT to prevent the installation of patches, service packs,
        device drivers, or Ubuntu operating system components without verification
        they have been digitally signed using a certificate that is recognized and
        approved by the organization.  \n  \nAdd or modify the following line in any
        file under the \"/etc/apt/apt.conf.d/\" directory: \n \nAPT::Get::AllowUnauthenticated
        \"false\";"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
