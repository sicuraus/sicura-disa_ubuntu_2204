    title: Ubuntu 22.04 LTS must initiate session audits at system startup.
    description: If auditing is enabled late in the startup process, the actions of
      some startup processes may not be audited. Some audit systems also maintain
      state information only available if auditing is enabled before a given process
      is created.
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to produce audit records at system startup.
        \ \n \nEdit the \"/etc/default/grub\" file and add \"audit=1\" to the \"GRUB_CMDLINE_LINUX\"
        option and to the \"GRUB_CMDLINE_LINUX_DEFAULT\" option. \n\nGRUB_CMDLINE_LINUX_DEFAULT=\"audit=1\"\nGRUB_CMDLINE_LINUX=\"audit=1\"\n
        \nTo update the grub config file, run: \n \n$ sudo update-grub"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
