    title: 'Ubuntu 22.04 LTS must implement NIST FIPS-validated cryptography to protect
      classified information and for the following: To provision digital signatures,
      to generate cryptographic hashes, and to protect unclassified information requiring
      confidentiality and cryptographic protection in accordance with applicable federal
      laws, Executive Orders, directives, policies, regulations, and standards.'
    description: |-
      Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data. The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government since this provides assurance they have been tested and validated.

      Satisfies: SRG-OS-000396-GPOS-00176, SRG-OS-000478-GPOS-00223
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to run in FIPS mode. Add \"fips=1\" to
        the kernel parameter during Ubuntu 22.04 LTS install.  \n  \nEnabling a FIPS
        mode on a pre-existing system involves a number of modifications to Ubuntu
        22.04 LTS. Refer to the Ubuntu Pro security certification documentation for
        instructions.   \n  \nA subscription to the \"Ubuntu Pro\" plan is required
        to obtain the FIPS Kernel cryptographic modules and enable FIPS. \n \nNote:
        Ubuntu Pro security certification instructions can be found at: https://ubuntu.com/security/certifications/docs/fips-enablement"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
