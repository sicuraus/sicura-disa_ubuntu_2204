    description: |-
      By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing, otherwise known as brute-forcing, is reduced. Limits are imposed by locking the account.

      Satisfies: SRG-OS-000021-GPOS-00005, SRG-OS-000329-GPOS-00128
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to utilize the \"pam_faillock\" module.
        \ \n \nAdd or modify the following lines in the \"/etc/pam.d/common-auth\"
        file, below the \"auth\" definition for \"pam_unix.so\":  \n \nauth     [default=die]
        \ pam_faillock.so authfail \nauth     sufficient          pam_faillock.so
        authsucc \n \nConfigure the \"pam_faillock\" module to use the following options.
        \n \nAdd or modify the following lines in the \"/etc/security/faillock.conf\"
        file: \n \naudit \nsilent \ndeny = 3 \nfail_interval = 900 \nunlock_time =
        0"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
