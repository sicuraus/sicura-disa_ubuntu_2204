    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260586r1069107_rule
    title: Ubuntu 22.04 LTS must use cryptographic mechanisms to protect the integrity
      of audit tools.
    description: "Protecting the integrity of the tools used for auditing purposes
      is a critical step toward ensuring the integrity of audit information. Audit
      information includes all information (e.g., audit records, audit settings, and
      audit reports) needed to successfully audit information system activity.  \n
      \ \nAudit tools include, but are not limited to, vendor-provided and open source
      audit tools needed to successfully view and manipulate audit information system
      activity and records. Audit tools include custom queries and report generators.
      \ \n  \nIt is not uncommon for attackers to replace the audit tools or inject
      code into the existing tools with the purpose of providing the capability to
      hide or erase system activity from the audit logs.  \n  \nTo address this risk,
      audit tools must be cryptographically signed in order to provide the capability
      to identify when the audit tools have been modified, manipulated, or replaced.
      An example is a checksum hash of the file or files."
    imported_data:
      fixtext: "Configure AIDE to protect the integrity of audit tools: \n \nAdd or
        modify the following lines in the \"/etc/aide/aide.conf\" file: \n \n# Audit
        Tools  \n/sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512  \n/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
        \ \n/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512  \n/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
        \ \n/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512  \n/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
