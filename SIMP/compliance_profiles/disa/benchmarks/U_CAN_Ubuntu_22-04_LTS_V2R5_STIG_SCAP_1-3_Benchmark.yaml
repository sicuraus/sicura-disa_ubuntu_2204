    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260489r1134796_rule
    title: Ubuntu 22.04 LTS must generate error messages that provide information
      necessary for corrective actions without revealing information that could be
      exploited by adversaries.
    description: "Any operating system providing too much information in error messages
      risks compromising the data and security of the structure, and organizations
      must carefully consider the content and structure of error messages.  \n  \nThe
      extent to which information systems are able to identify and handle error conditions
      is guided by organizational policy and operational requirements. Information
      that could be exploited by adversaries includes, for example, erroneous logon
      attempts with passwords entered by mistake as the username, mission/business
      information that can be derived from (if not stated explicitly by) information
      recorded, and personal information, such as account numbers, Social Security
      numbers, and credit card numbers. \n \nThe /var/log/btmp, /var/log/wtmp, and
      /var/log/lastlog files have group write and global read permissions to allow
      for the lastlog function to perform. Limiting the permissions beyond this configuration
      will result in the failure of functions that rely on the lastlog database."
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to set permissions of all log files under
        the \"/var/log\" directory to \"640\" or more restricted by using the following
        command: \n \nNote: The btmp, wtmp, and lastlog files are excluded. Refer
        to the Discussion for details. \n \n     $ sudo find /var/log -perm /137 !
        -name '*[bw]tmp' ! -name '*lastlog' -type f -exec chmod 640 '{}' \\;"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
