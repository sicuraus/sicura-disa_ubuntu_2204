    title: Ubuntu 22.04 LTS must automatically exit interactive command shell user
      sessions after 15 minutes of inactivity.
    description: Terminating an idle interactive command shell user session within
      a short time period reduces the window of opportunity for unauthorized personnel
      to take control of it when left unattended in a virtual terminal or physical
      console.
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to exit interactive command shell user
        sessions after 15 minutes of inactivity. \n \nCreate and/or append a custom
        file under \"/etc/profile.d/\" by using the following command: \n \n     $
        sudo su -c \"echo TMOUT=900 >> /etc/profile.d/99-terminal_tmout.sh\" \n  \nThis
        will set a timeout value of 15 minutes for all future sessions.  \n  \nTo
        set the timeout for the current sessions, execute the following command over
        the terminal session:  \n  \n     $ export TMOUT=900"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
