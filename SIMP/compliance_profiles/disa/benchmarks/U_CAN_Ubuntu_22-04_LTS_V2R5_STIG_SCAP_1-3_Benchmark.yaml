    title: Ubuntu 22.04 LTS must configure audit tools to be owned by "root".
    description: |-
      Protecting audit information also includes identifying and protecting the tools used to view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.

      Operating systems providing tools to interface with audit information will leverage user permissions and roles identifying the user accessing the tools and the corresponding rights the user enjoys in order to make access decisions regarding the access to audit tools.

      Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.

      Satisfies: SRG-OS-000256-GPOS-00097, SRG-OS-000257-GPOS-00098
    imported_data:
      fixtext: "Configure the audit tools on Ubuntu 22.04 LTS to be protected from
        unauthorized access by setting the file owner as root using the following
        command:  \n  \n     $ sudo chown root <audit_tool_name>  \n  \nReplace \"<audit_tool_name>\"
        with each audit tool not owned by \"root\"."
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
