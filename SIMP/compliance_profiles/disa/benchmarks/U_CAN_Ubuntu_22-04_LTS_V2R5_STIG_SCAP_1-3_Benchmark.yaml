    title: Ubuntu 22.04 LTS must be configured to preserve log records from failure
      events.
    description: "Failure to a known state can address safety or security in accordance
      with the mission/business needs of the organization. Failure to a known secure
      state helps prevent a loss of confidentiality, integrity, or availability in
      the event of a failure of the information system or a component of the system.
      \  \n  \nPreserving operating system state information helps to facilitate operating
      system restart and return to the operational mode of the organization with least
      disruption to mission/business processes."
    imported_data:
      fixtext: "Install the log service by using the following command:  \n \n     $
        sudo apt-get install rsyslog \n  \nEnable and activate the log service by
        using the following command:  \n  \n     $ sudo systemctl enable rsyslog.service
        --now"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
