    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260589r958406_rule
    title: Ubuntu 22.04 LTS must monitor remote access methods.
    description: "Remote access services, such as those providing remote access to
      network devices and information systems, which lack automated monitoring capabilities,
      increase risk and make remote user access management difficult at best.  \n
      \ \nRemote access is access to DOD nonpublic information systems by an authorized
      user (or an information system) communicating through an external, nonorganization-controlled
      network. Remote access methods include, for example, dial-up, broadband, and
      wireless.  \n  \nAutomated monitoring of remote access sessions allows organizations
      to detect cyberattacks and also ensure ongoing compliance with remote access
      policies by auditing connection activities of remote access capabilities, such
      as Remote Desktop Protocol (RDP), on a variety of information system components
      (e.g., servers, workstations, notebook computers, smartphones, and tablets)."
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to monitor all remote access methods. \n
        \nAdd or modify the following line in the \"/etc/rsyslog.d/50-default.conf\"
        file: \n \nauth.*,authpriv.* /var/log/secure  \ndaemon.* /var/log/messages
        \ \n \nRestart \"rsyslog.service\" for the changes to take effect by using
        the following command:  \n  \n     $ sudo systemctl restart rsyslog.service"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
