    title: Ubuntu 22.04 LTS must enforce 24 hours/one day as the minimum password
      lifetime. Passwords for new users must have a 24 hours/one day minimum password
      lifetime restriction.
    description: Enforcing a minimum password lifetime helps to prevent repeated password
      changes to defeat the password reuse or history enforcement requirement. If
      users are allowed to immediately and continually change their password, then
      the password could be repeatedly changed in a short period of time to defeat
      the organization's policy regarding password reuse.
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to enforce a 24 hours/one day minimum password
        lifetime.  \n  \nAdd or modify the following line in the \"/etc/login.defs\"
        file:  \n  \nPASS_MIN_DAYS    1"
    confine:
