    title: Ubuntu 22.04 LTS must enforce a 60-day maximum password lifetime restriction.
      Passwords for new users must have a 60-day maximum password lifetime restriction.
    description: Any password, no matter how complex, can eventually be cracked. Therefore,
      passwords need to be changed periodically. If the operating system does not
