    title: Ubuntu 22.04 LTS must not allow unattended or automatic login via SSH.
    description: Failure to restrict system access to authenticated users negatively
      impacts Ubuntu 22.04 LTS security.
    imported_data:
      fixtext: "Configure the SSH server to not allow unattended or automatic login
        to the system.  \n  \nAdd or modify the following lines in the \"/etc/ssh/sshd_config\"
        file:  \n  \nPermitEmptyPasswords no \nPermitUserEnvironment no \n  \nRestart
        the SSH daemon for the changes to take effect: \n  \n     $ sudo systemctl
        restart sshd.service"
    confine:
