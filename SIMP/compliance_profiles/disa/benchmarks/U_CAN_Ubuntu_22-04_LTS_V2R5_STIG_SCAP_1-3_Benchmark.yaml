    title: Ubuntu 22.04 LTS must disable automatic mounting of Universal Serial Bus
      (USB) mass storage driver.
    description: "Without authenticating devices, unidentified or unknown devices
      may be introduced, thereby facilitating malicious activity. \n \nPeripherals
      include, but are not limited to, such devices as flash drives, external storage,
      and printers."
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to disable using the USB storage kernel
        module.  \n \nCreate and/or append a custom file under \"/etc/modprobe.d/\"
        to contain the following: \n \n     $ sudo su -c \"echo install usb-storage
        /bin/false >> /etc/modprobe.d/stig.conf\" \n \nConfigure Ubuntu 22.04 LTS
        to disable the ability to use USB mass storage devices. \n \n     $ sudo su
        -c \"echo blacklist usb-storage >> /etc/modprobe.d/stig.conf\""
    confine:
