    title: Ubuntu 22.04 LTS must disable kernel core dumps so that it can fail to
      a secure state if system initialization fails, shutdown fails or aborts fail.
    description: Kernel core dumps may contain the full contents of system memory
      at the time of the crash. Kernel core dumps may consume a considerable amount
      of disk space and may result in denial of service by exhausting the available
      space on the target file system partition.
    imported_data:
      fixtext: |-
        If kernel core dumps are not required, disable and mask "kdump-tools.service" by using the following command:

        $ sudo systemctl mask kdump-tools --now

        If kernel core dumps are required, document the need with the ISSO.
