      passwords are changed.
    description: "If the operating system allows the user to consecutively reuse extensive
      portions of passwords, this increases the chances of password compromise by
      increasing the window of opportunity for attempts at guessing and brute-force
      attacks.  \n  \nThe number of changed characters refers to the number of changes
      required with respect to the total number of positions in the current password.
      In other words, characters may be the same within the two passwords; however,
      the positions of the like characters must be different.  \n  \nIf the password
      length is an odd number then number of changed characters must be rounded up.
      For example, a password length of 15 characters must require the change of at
      least eight characters."
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to require the change of at least eight
        characters when passwords are changed.  \n  \nAdd or modify the following
        line in the \"/etc/security/pwquality.conf\" file: \n \ndifok = 8"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
