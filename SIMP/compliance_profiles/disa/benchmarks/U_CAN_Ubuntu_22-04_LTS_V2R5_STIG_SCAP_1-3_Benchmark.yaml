    title: Ubuntu 22.04 LTS must uniquely identify interactive users.
    description: "To ensure accountability and prevent unauthenticated access, organizational
      users must be identified and authenticated to prevent potential misuse and compromise
      of the system.  \n  \nOrganizational users include organizational employees
      or individuals the organization deems to have equivalent status of employees
      (e.g., contractors). Organizational users (and processes acting on behalf of
      users) must be uniquely identified and authenticated to all accesses, except
      for the following:   \n  \n1. Accesses explicitly identified and documented
      by the organization. Organizations document specific user actions that can be
      performed on the information system without identification or authentication;
      and  \n  \n2. Accesses that occur through authorized use of group authenticators
      without individual authentication. Organizations may require unique identification
      of individuals in group accounts (e.g., shared privilege accounts) or for detailed
      accountability of individual activity.\n\nSatisfies: SRG-OS-000104-GPOS-00051,
      SRG-OS-000121-GPOS-00062"
    imported_data:
      fixtext: Edit the file "/etc/passwd" and provide each interactive user account
        that has a duplicate UID with a unique UID.
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
