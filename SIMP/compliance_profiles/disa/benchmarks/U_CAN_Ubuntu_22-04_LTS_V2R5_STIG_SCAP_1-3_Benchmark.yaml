    title: Ubuntu 22.04 LTS must not have the "telnet" package installed.
    description: "It is detrimental for operating systems to provide, or install by
      default, functionality exceeding requirements or mission objectives. These unnecessary
      capabilities are often overlooked and therefore, may remain unsecure. They increase
      the risk to the platform by providing additional attack vectors. \n \nTelnet
      is a client/server application protocol that provides an unencrypted remote
      access service, which does not provide for the confidentiality and integrity
      of user passwords or the remote session. If users were allowed to login to a
      system using Telnet, the privileged user passwords and communications could
      be compromised. \n \nRemoving the \"telnetd\" package decreases the risk of
      accidental or intentional activation of the Telnet service."
    imported_data:
      fixtext: "Remove the \"telnetd\" package by using the following command:  \n
        \ \n     $ sudo apt-get remove telnetd"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
