    title: Ubuntu 22.04 LTS must have the "apparmor" package installed.
    description: "Control of program execution is a mechanism used to prevent execution
      of unauthorized programs. Some operating systems may provide a capability that
      runs counter to the mission or provides users with functionality that exceeds
      mission requirements. This includes functions and services installed at the
      operating system level.  \n  \nSome of the programs, installed by default, may
      be harmful or may not be necessary to support essential organizational operations
      (e.g., key missions, functions). Removal of executable programs is not always
      possible; therefore, establishing a method of preventing program execution is
      critical to maintaining a secure system baseline.  \n  \nMethods for complying
      with this requirement include restricting execution of programs in certain environments,
      while preventing execution in other environments; or limiting execution of certain
      program functionality based on organization-defined criteria (e.g., privileges,
      subnets, sandboxed environments, or roles).\n\nSatisfies: SRG-OS-000312-GPOS-00124,
      SRG-OS-000368-GPOS-00154, SRG-OS-000370-GPOS-00155"
    imported_data:
      fixtext: "Install the \"appArmor\" package by using the following command:  \n
        \ \n     $ sudo apt-get install apparmor"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
