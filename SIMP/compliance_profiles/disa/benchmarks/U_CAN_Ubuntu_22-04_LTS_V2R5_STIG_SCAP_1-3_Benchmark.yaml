    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260594r1038966_rule
    title: Ubuntu 22.04 LTS must shut down by default upon audit failure.
    description: "It is critical that when the operating system is at risk of failing
      to process audit logs as required, it takes action to mitigate the failure.
      Audit processing failures include: software/hardware errors; failures in the
      audit capturing mechanisms; and audit storage capacity being reached or exceeded.
      Responses to audit failure depend upon the nature of the failure mode.  \n  \nWhen
      availability is an overriding concern, other approved actions in response to
      an audit failure are as follows:   \n  \n1. If the failure was caused by the
      lack of audit record storage capacity, the operating system must continue generating
      audit records if possible (automatically restarting the audit service if necessary),
      overwriting the oldest audit records in a first-in-first-out manner.  \n  \n2.
      If audit records are sent to a centralized collection server and communication
      with this server is lost or the server fails, the operating system must queue
      audit records locally until communication is restored or until the audit records
      are retrieved manually. Upon restoration of the connection to the centralized
      collection server, action should be taken to synchronize the local audit data
      with the collection server."
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to shut down by default upon audit failure.
        \ \n  \nAdd or modify the following line in the \"/etc/audit/auditd.conf \"
        file: \n \ndisk_full_action = HALT \n  \nRestart the \"auditd\" service for
        the changes to take effect:  \n  \n     $ sudo systemctl restart auditd.service
        \n \nNote: If system availability has been determined to be more important,
        and this decision is documented with the ISSO, configure Ubuntu 22.04 LTS
        to notify system administration staff and ISSO staff in the event of an audit
        processing failure by setting the \"disk_full_action\" to \"SYSLOG\" or \"SINGLE\"."
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
