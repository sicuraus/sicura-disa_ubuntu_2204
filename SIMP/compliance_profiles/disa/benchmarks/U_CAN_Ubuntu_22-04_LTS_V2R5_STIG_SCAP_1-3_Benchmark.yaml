    title: Ubuntu 22.04 LTS must disable the x86 Ctrl-Alt-Delete key sequence.
    description: A locally logged-on user who presses Ctrl-Alt-Delete, when at the
      console, can reboot the system. If accidentally pressed, as could happen in
      the case of a mixed OS environment, this can create the risk of short-term loss
      of availability of systems due to unintentional reboot.
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to disable the Ctrl-Alt-Delete sequence
        for the command line by using the following commands: \n \n     $ sudo systemctl
        disable ctrl-alt-del.target \n \n     $ sudo systemctl mask ctrl-alt-del.target
        \n \nReload the daemon to take effect:  \n \n     $ sudo systemctl daemon-reload"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
