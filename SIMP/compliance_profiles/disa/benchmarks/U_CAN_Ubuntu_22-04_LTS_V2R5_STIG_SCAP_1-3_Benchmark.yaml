    title: Ubuntu 22.04 LTS must allow users to directly initiate a session lock for
      all connection types.
    description: "A session lock is a temporary action taken when a user stops work
      and moves away from the immediate physical vicinity of the information system
      but does not want to log out because of the temporary nature of the absence.
      \ \n  \nThe session lock is implemented at the point where session activity
      can be determined. Rather than be forced to wait for a period of time to expire
      before the user session can be locked, Ubuntu 22.04 LTS need to provide users
      with the ability to manually invoke a session lock so users may secure their
      session if they need to temporarily vacate the immediate physical vicinity.\n\nSatisfies:
      SRG-OS-000030-GPOS-00011, SRG-OS-000031-GPOS-00012"
    imported_data:
      fixtext: "Install the \"vlock\" package by using the following command:  \n
        \ \n     $ sudo apt-get install vlock"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
