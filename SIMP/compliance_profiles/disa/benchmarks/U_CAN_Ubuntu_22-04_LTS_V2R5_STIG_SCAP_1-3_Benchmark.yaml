    title: Ubuntu 22.04 LTS must prevent all software from executing at higher privilege
      levels than users executing the software and the audit system must be configured
      to audit the execution of privileged functions.
    description: "In certain situations, software applications/programs need to execute
      with elevated privileges to perform required functions. However, if the privileges
      required for execution are at a higher level than the privileges assigned to
      organizational users invoking such applications/programs, those users are indirectly
      provided with greater privileges than assigned by the organizations.  \n  \nSome
      programs and processes are required to operate at a higher privilege level and
      therefore should be excluded from the organization-defined software list after
      review.\n\nSatisfies: SRG-OS-000326-GPOS-00126, SRG-OS-000327-GPOS-00127"
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to audit the execution of all privileged
        functions.  \n  \nAdd or modify the following lines in the \"/etc/audit/rules.d/stig.rules\"
        file:  \n  \n-a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k
        execpriv \n-a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k
        execpriv \n-a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k
        execpriv \n-a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k
        execpriv \n \nTo reload the rules file, issue the following command:  \n  \n
        \    $ sudo augenrules --load \n \nNote: The \"-k <keyname>\" at the end of
        the line gives the rule a unique meaning to help during an audit investigation.
        The <keyname> does not need to match the example above."
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
