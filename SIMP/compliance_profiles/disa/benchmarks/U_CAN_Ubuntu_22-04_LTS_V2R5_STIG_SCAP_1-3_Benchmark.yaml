    title: Ubuntu 22.04 LTS must notify designated personnel if baseline configurations
      are changed in an unauthorized manner. The file integrity tool must notify the
      system administrator when changes to the baseline configuration or anomalies
      in the operation of any security functions are discovered.
    description: "Unauthorized changes to the baseline configuration could make the
      system vulnerable to various attacks or allow unauthorized access to the operating
      system. Changes to operating system configurations can have unintended side
      effects, some of which may be relevant to security.  \n  \nDetecting such changes
      and providing an automated response can help avoid unintended, negative consequences
      that could ultimately affect the security state of the operating system. The
      operating system's IMO/ISSO and SAs must be notified via email and/or monitoring
      system trap when there is an unauthorized modification of a configuration item.\n\nSatisfies:
      SRG-OS-000363-GPOS-00150, SRG-OS-000447-GPOS-00201"
    imported_data:
      fixtext: "Configure AIDE to notify designated personnel if baseline configurations
        are changed in an unauthorized manner. \n \nAdd or modify the following line
        in the \"/etc/default/aide\" file: \n \nSILENTREPORTS=no"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
