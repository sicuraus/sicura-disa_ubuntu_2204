    title: Ubuntu 22.04 LTS must be configured to use TCP syncookies.
    description: "DoS is a condition when a resource is not available for legitimate
      users. When this occurs, the organization either cannot accomplish its mission
      or must operate at degraded capacity.   \n  \nManaging excess capacity ensures
      that sufficient capacity is available to counter flooding attacks. Employing
      increased capacity and service redundancy may reduce the susceptibility to some
      DoS attacks. Managing excess capacity may include, for example, establishing
      selected usage priorities, quotas, or partitioning."
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to use TCP syncookies by using the following
        command:  \n  \n     $ sudo sysctl -w net.ipv4.tcp_syncookies=1  \n  \nIf
        \"1\" is not the system's default value, add or update the following line
        in \"/etc/sysctl.conf\":  \n  \n     net.ipv4.tcp_syncookies = 1"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
