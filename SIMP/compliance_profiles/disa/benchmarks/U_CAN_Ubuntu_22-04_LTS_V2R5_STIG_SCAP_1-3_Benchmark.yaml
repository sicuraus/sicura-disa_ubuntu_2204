      data to attackers, thus compromising its confidentiality.  \n  \nAudit information
      includes all information (e.g., audit records, audit settings, audit reports)
      needed to successfully audit operating system activity.\n\nSatisfies: SRG-OS-000057-GPOS-00027,
      SRG-OS-000058-GPOS-00028"
