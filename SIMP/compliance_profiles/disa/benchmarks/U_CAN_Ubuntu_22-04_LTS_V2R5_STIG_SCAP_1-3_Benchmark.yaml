    title: Ubuntu 22.04 LTS must have an application firewall installed in order to
      control remote access methods.
    description: "Remote access services, such as those providing remote access to
      network devices and information systems, which lack automated control capabilities,
      increase risk and make remote user access management difficult at best.  \n
      \ \nRemote access is access to DOD nonpublic information systems by an authorized
      user (or an information system) communicating through an external, nonorganization-controlled
      network. Remote access methods include, for example, dial-up, broadband, and
      wireless.  \n  \nUbuntu 22.04 LTS functionality (e.g., RDP) must be capable
      of taking enforcement action if the audit reveals unauthorized activity. Automated
      control of remote access sessions allows organizations to ensure ongoing compliance
      with remote access policies by enforcing connection rules of remote access applications
      on a variety of information system components (e.g., servers, workstations,
      notebook computers, smartphones, and tablets)."
    imported_data:
      fixtext: "Install the Uncomplicated Firewall by using the following command:
        \ \n  \n     $ sudo apt-get install ufw"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
