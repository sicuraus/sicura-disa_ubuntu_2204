    title: Ubuntu 22.04 LTS must not have the "rsh-server" package installed.
    description: "It is detrimental for operating systems to provide, or install by
      default, functionality exceeding requirements or mission objectives. These unnecessary
      capabilities or services are often overlooked and therefore may remain unsecured.
      They increase the risk to the platform by providing additional attack vectors.
      \ \n  \nRemote Shell (RSH) is a client/server application protocol that provides
      an unencrypted remote access service, which does not provide for the confidentiality
      and integrity of user passwords or the remote session. If users were allowed
      to login to a system using RSH, the privileged user passwords and communications
      could be compromised. \n \nRemoving the \"rsh-server\" package decreases the
      risk of accidental or intentional activation of the RSH service."
    imported_data:
      fixtext: "Remove the \"rsh-server\" package by using the following command:
        \ \n \n     $ sudo apt-get remove rsh-server"
    confine:
      os.release.major:
