    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260582r958944_rule
    title: Ubuntu 22.04 LTS must use a file integrity tool to verify correct operation
      of all security functions.
    description: "Without verification of the security functions, security functions
      may not operate correctly and the failure may go unnoticed. Security function
      is defined as the hardware, software, and/or firmware of the information system
      responsible for enforcing the system security policy and supporting the isolation
      of code and data on which the protection is based. Security functionality includes,
      but is not limited to, establishing system accounts, configuring access authorizations
      (i.e., permissions, privileges), setting events to be audited, and setting intrusion
      detection parameters.  \n  \nThis requirement applies to Ubuntu 22.04 LTS performing
      security function verification/testing and/or systems and environments that
      require this functionality."
    imported_data:
      fixtext: "Install the \"aide\" package: \n \n     $ sudo apt install aide"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
