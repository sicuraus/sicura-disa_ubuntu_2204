        unauthorized access. Run the following command:  \n  \n     $ sudo find /bin
        /sbin /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -perm /022 -type d
        -exec chmod -R 755 '{}' \\;"
    confine:
