    title: Ubuntu 22.04 LTS must enforce password complexity by requiring at least
      one uppercase character be used.
    description: "Use of a complex password helps to increase the time and resources
      required to compromise the password. Password complexity, or strength, is a
      measure of the effectiveness of a password in resisting attempts at guessing
      and brute-force attacks.  \n  \nPassword complexity is one factor of several
      that determines how long it takes to crack a password. The more complex the
      password, the greater the number of possible combinations that need to be tested
      before the password is compromised."
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to enforce password complexity by requiring
        that at least one uppercase character be used.  \n \nAdd or modify the following
        line in the \"/etc/security/pwquality.conf\" file: \n  \nucredit = -1"
