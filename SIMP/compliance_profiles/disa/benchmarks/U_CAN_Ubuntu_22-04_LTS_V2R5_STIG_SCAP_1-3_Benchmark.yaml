    title: Ubuntu 22.04 LTS must implement address space layout randomization to protect
      its memory from unauthorized code execution.
    description: "Some adversaries launch attacks with the intent of executing code
      in nonexecutable regions of memory or in prohibited memory locations. Security
      safeguards employed to protect memory include, for example, data execution prevention
      and address space layout randomization. Data execution prevention safeguards
      can either be hardware-enforced or software-enforced with hardware providing
      the greater strength of mechanism.  \n  \nExamples of attacks are buffer overflow
      attacks."
    imported_data:
      fixtext: "Remove the \"kernel.randomize_va_space\" entry found in the \"/etc/sysctl.conf\"
        file or any file located in the \"/etc/sysctl.d/\" directory.  \n \nReload
        the system configuration files for the changes to take effect by using the
        following command: \n \n     $ sudo sysctl --system"
    confine:
