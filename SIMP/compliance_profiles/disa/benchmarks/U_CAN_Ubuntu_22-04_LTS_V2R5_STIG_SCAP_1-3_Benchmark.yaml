    title: Ubuntu 22.04 LTS must immediately notify the system administrator (SA)
      and information system security officer (ISSO) when the audit record storage
      volume reaches 25 percent remaining of the allocated capacity.
    description: If security personnel are not notified immediately when storage volume
      reaches 25 percent remaining of the allocated capacity, they are unable to plan
      for audit record storage capacity expansion.
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to notify the SA and ISSO when the audit
        record storage volume reaches 25 percent remaining of the allocated capacity.
        \n \nAdd or modify the following lines in the \"/etc/audit/auditd.conf \"
        file: \n \nspace_left = 25% \nspace_left_action = email \n \nRestart the \"auditd\"
        service for the changes to take effect:  \n  \n     $ sudo systemctl restart
        auditd.service \n  \nNote: If the \"space_left_action\" parameter is set to
        \"exec\", ensure the command being executed notifies the SA and ISSO."
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
