    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260527r986275_rule
    title: Ubuntu 22.04 LTS must be configured so that all network connections associated
      with SSH traffic terminate after becoming unresponsive.
    description: "Terminating an unresponsive SSH session within a short time period
      reduces the window of opportunity for unauthorized personnel to take control
      of a management session enabled on the console or console port that has been
      left unattended. In addition, quickly terminating an idle SSH session will also
      free up resources committed by the managed network element. \n \nTerminating
      network connections associated with communications sessions includes, for example,
      deallocating associated TCP/IP address/port pairs at the operating system level
      and deallocating networking assignments at the application level if multiple
      application sessions are using a single operating system-level network connection.
      This does not mean the operating system terminates all sessions or network access;
      it only ends the unresponsive session and releases the resources associated
      with that session."
    imported_data:
      fixtext: "Configure the SSH server to terminate a user session automatically
        after the SSH client has become unresponsive. \n \nNote: This setting must
        be applied in conjunction with UBTU-22-255040 to function correctly. \n \nAdd
        or modify the following line in the \"/etc/ssh/sshd_config\" file: \n  \nClientAliveCountMax
        1 \n  \nRestart the SSH daemon for the changes to take effect:  \n  \n     $
        sudo systemctl restart sshd.service"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
