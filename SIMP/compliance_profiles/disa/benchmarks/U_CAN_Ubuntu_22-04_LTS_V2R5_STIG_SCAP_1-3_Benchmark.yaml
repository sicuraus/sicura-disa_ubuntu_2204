    title: Ubuntu 22.04 LTS must be a vendor-supported release.
    description: "An operating system release is considered \"supported\" if the vendor
      continues to provide security patches for the product. With an unsupported release,
      it will not be possible to resolve security issues discovered in the system
      software.\n\nThe support status of the OS depends on its subscription status.
      \ \n\nEnd of life dates for Ubuntu 22.04 releases are as follows:\nStandard
      Support: April 2027\nExtended Security Maintenance (ESM): April 2032\n\nESM
      is available via an Ubuntu Pro subscription."
    imported_data:
      fixtext: Upgrade to a supported version of Ubuntu 22.04 LTS.
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
