    title: Ubuntu 22.04 LTS must generate audit records for successful/unsuccessful
      uses of the chmod, fchmod, and fchmodat system calls.
    description: "Without generating audit records specific to the security and mission
      needs of the organization, it would be difficult to establish, correlate, and
      investigate the events relating to an incident or identify those responsible
      for one.  \n  \nAudit records can be generated from various components within
      the information system (e.g., module or policy filter). \n \nThe system call
      rules are loaded into a matching engine that intercepts each syscall that all
      programs on the system makes. Therefore, it is very important to only use syscall
      rules when absolutely necessary since these affect performance. The more rules,
      the bigger the performance hit. The performance is helped, though, by combining
      syscalls into one rule whenever possible.\n\nSatisfies: SRG-OS-000064-GPOS-00033,
      SRG-OS-000462-GPOS-00206"
    imported_data:
      fixtext: "Configure the audit system to generate an audit event for any successful/unsuccessful
        use of the \"chmod\", \"fchmod\", and \"fchmodat\" system calls.  \n  \nAdd
        or modify the following lines in the \"/etc/audit/rules.d/stig.rules\":  \n
        \ \n-a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset
        -k perm_chng \n-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000
        -F auid!=unset -k perm_chng \n \nTo reload the rules file, issue the following
        command:  \n  \n     $ sudo augenrules --load \n \nNote: The \"-k <keyname>\"
        at the end of the line gives the rule a unique meaning to help during an audit
        investigation. The <keyname> does not need to match the example above."
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
