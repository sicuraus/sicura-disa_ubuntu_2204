    title: Ubuntu 22.04 LTS must be configured so that audit configuration files are
      not write-accessible by unauthorized users.
    description: "Without the capability to restrict which roles and individuals can
      select which events are audited, unauthorized personnel may be able to prevent
      the auditing of critical events.  \n  \nMisconfigured audits may degrade the
      system's performance by overwhelming the audit log. Misconfigured audits may
      also make it more difficult to establish, correlate, and investigate the events
      relating to an incident or identify those responsible for one."
    imported_data:
