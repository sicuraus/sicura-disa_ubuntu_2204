    title: Ubuntu 22.04 LTS must configure the SSH daemon to use Message Authentication
      Codes (MACs) employing FIPS 140-3-approved cryptographic hashes to prevent the
      unauthorized disclosure of information and/or detect changes to information
      during transmission.
    description: "Without cryptographic integrity protections, information can be
      altered by unauthorized users without detection.   \n  \nRemote access (e.g.,
      RDP) is access to DOD nonpublic information systems by an authorized user (or
      an information system) communicating through an external, non-organization-controlled
      network. Remote access methods include, for example, dial-up, broadband, and
      wireless. Nonlocal maintenance and diagnostic activities are those activities
      conducted by individuals communicating through a network, either an external
      network (e.g., the internet) or an internal network.   \n  \nLocal maintenance
      and diagnostic activities are those activities carried out by individuals physically
      present at the information system or information system component and not communicating
      across a network connection.   \n  \nEncrypting information for transmission
      protects information from unauthorized disclosure and modification. Cryptographic
      mechanisms implemented to protect information integrity include, for example,
      cryptographic hash functions, which have common application in digital signatures,
      checksums, and message authentication codes.\n\nSatisfies: SRG-OS-000250-GPOS-00093,
      SRG-OS-000393-GPOS-00173, SRG-OS-000424-GPOS-00188"
    imported_data:
      fixtext: "Configure the SSH server to only use MACs that employ FIPS 140-3 approved
        hashes.  \n  \nAdd or modify the following line in the \"/etc/ssh/sshd_config\"
        file: \n \nMACs hmac-sha2-512,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-256-etm@openssh.com
        \n  \nRestart the SSH server for the changes to take effect:  \n  \n     $
        sudo systemctl reload sshd.service"
