    title: Ubuntu 22.04 LTS must generate audit records for successful/unsuccessful
      uses of the apparmor_parser command.
    description: "Without generating audit records specific to the security and mission
      needs of the organization, it would be difficult to establish, correlate, and
      investigate the events relating to an incident or identify those responsible
      for one.  \n  \nAudit records can be generated from various components within
      the information system (e.g., module or policy filter)."
    imported_data:
      fixtext: "Configure the audit system to generate an audit event for any successful/unsuccessful
        use of the \"apparmor_parser\" command. \n \nAdd or modify the following line
        in the \"/etc/audit/rules.d/stig.rules\" file: \n \n-a always,exit -F path=/sbin/apparmor_parser
        -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng \n \nTo reload the rules
        file, issue the following command: \n \n     $ sudo augenrules --load \n \nNote:
        The \"-k <keyname>\" at the end of the line gives the rule a unique meaning
        to help during an audit investigation. The <keyname> does not need to match
        the example above."
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
