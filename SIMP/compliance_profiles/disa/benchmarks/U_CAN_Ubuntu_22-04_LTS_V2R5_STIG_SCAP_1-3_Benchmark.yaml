    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-260573r1015019_rule
    title: Ubuntu 22.04 LTS must implement multifactor authentication for remote access
      to privileged accounts in such a way that one of the factors is provided by
      a device separate from the system gaining access.
    description: "Using an authentication device, such as a CAC or token separate
      from the information system, ensures that even if the information system is
      compromised, that compromise will not affect credentials stored on the authentication
      device.  \n  \nMultifactor solutions that require devices separate from information
      systems gaining access include, for example, hardware tokens providing time-based
      or challenge-response authenticators and smart cards such as the U.S. Government
      personal identity verification card and the DOD common access card.  \n  \nA
      privileged account is defined as an information system account with authorizations
      of a privileged user.  \n  \nRemote access is access to DOD nonpublic information
      systems by an authorized user (or an information system) communicating through
      an external, nonorganization-controlled network. Remote access methods include,
      for example, dial-up, broadband, and wireless.  \n  \nThis requirement only
      applies to components where this is specific to the function of the device or
      has the concept of an organizational user (e.g., VPN, proxy capability). This
      does not apply to authentication for the purpose of configuring the device itself
      (management).\n\nSatisfies: SRG-OS-000375-GPOS-00160, SRG-OS-000105-GPOS-00052,
      SRG-OS-000106-GPOS-00053, SRG-OS-000107-GPOS-00054, SRG-OS-000108-GPOS-00055"
    imported_data:
      fixtext: "Install the \"libpam-pkcs11\" package by using the following command:
        \n \n     $ sudo apt-get install libpam-pkcs11"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
