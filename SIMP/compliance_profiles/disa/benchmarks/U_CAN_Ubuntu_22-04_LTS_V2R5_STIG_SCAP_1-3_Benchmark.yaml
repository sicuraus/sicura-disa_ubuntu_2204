    title: Ubuntu 22.04 LTS must be configured so that the audit log directory is
      not write-accessible by unauthorized users.
    description: "If audit information were to become compromised, then forensic analysis
      and discovery of the true source of potentially malicious system activity is
      impossible to achieve.  \n  \nTo ensure the veracity of audit information, the
      operating system must protect audit information from unauthorized deletion.
      This requirement can be achieved through multiple methods, which will depend
      upon system architecture and design.  \n  \nAudit information includes all information
      (e.g., audit records, audit settings, audit reports) needed to successfully
      audit information system activity."
    imported_data:
      fixtext: "Configure the audit log directory to have a mode of \"750\" or less
        permissive.  \n  \nUsing the path of the directory containing the audit logs,
        configure the audit log directory to have a mode of \"750\" or less permissive
        by using the following command:  \n  \n     $ sudo chmod -R  g-w,o-rwx /var/log/audit"
