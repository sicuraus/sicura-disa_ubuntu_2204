    title: Ubuntu 22.04 LTS must restrict access to the kernel message buffer.
    description: Restricting access to the kernel message buffer limits access only
      to root. This prevents attackers from gaining additional system information
      as a nonprivileged user.
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to restrict access to the kernel message
        buffer. \n \nAdd or modify the following line in the \"/etc/sysctl.conf\"
        file: \n \nkernel.dmesg_restrict = 1 \n \nRemove any configurations that conflict
        with the above from the following locations:  \n \n/run/sysctl.d/ \n/etc/sysctl.d/
        \n/usr/local/lib/sysctl.d/ \n/usr/lib/sysctl.d/ \n/lib/sysctl.d/ \n/etc/sysctl.conf
        \n \nReload settings from all system configuration files by using the following
        command: \n \n     $ sudo sysctl --system"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
