    title: Ubuntu 22.04 LTS must limit the number of concurrent sessions to ten for
      all accounts and/or account types.
    description: "Ubuntu 22.04 LTS management includes the ability to control the
      number of users and user sessions that utilize an operating system. Limiting
      the number of allowed users and sessions per user is helpful in reducing the
      risks related to denial-of-service (DoS) attacks.  \n  \nThis requirement addresses
      concurrent sessions for information system accounts and does not address concurrent
      sessions by single users via multiple system accounts. The maximum number of
      concurrent sessions should be defined based upon mission needs and the operational
      environment for each system."
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to limit the number of concurrent sessions
        to 10 for all accounts and/or account types.  \n  \nAdd or modify the following
        line at the top of the \"/etc/security/limits.conf\" file:  \n  \n* hard maxlogins
        10"
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
