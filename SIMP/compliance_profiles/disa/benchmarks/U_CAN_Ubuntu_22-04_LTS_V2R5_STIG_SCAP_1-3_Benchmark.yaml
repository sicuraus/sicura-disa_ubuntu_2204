    title: Ubuntu 22.04 LTS must be configured so that when passwords are changed
      or new passwords are established, pwquality must be used.
    description: Use of a complex password helps to increase the time and resources
      required to compromise the password. Password complexity, or strength, is a
      measure of the effectiveness of a password in resisting attempts at guessing
      and brute-force attacks. "pwquality" enforces complex password construction
      configuration and has the ability to limit brute-force attacks on the system.
    imported_data:
      fixtext: "Configure Ubuntu 22.04 LTS to enforce password complexity rules. \n
        \ \nAdd or modify the following line in the \"/etc/security/pwquality.conf\"
        file: \n  \nenforcing = 1  \n  \nAdd or modify the following line in the \"/etc/pam.d/common-password\"
        file: \n  \npassword requisite pam_pwquality.so retry=3  \n  \nNote: The value
        of \"retry\" should be between \"1\" and \"3\"."
    confine:
      os.release.major:
      - '22.04'
      os.name:
      - Ubuntu
